[project]
name = "loghunter-ai"
version = "0.1.0"
description = "ML-Powered Threat Hunting & Log Anomaly Detection"
authors = [
    {name = "Ranas Mukminov", email = "ranas@run-as-daemon.ru"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
    "confluent-kafka>=2.3.0",
    "redis>=5.0.0",
    "clickhouse-driver>=0.2.6",
    "elasticsearch>=8.10.0",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.17.0",
    "structlog>=23.2.0",
    "grok>=1.0.0",
    "pygrok>=1.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --cov=src"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
